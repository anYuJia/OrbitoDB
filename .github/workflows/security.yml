name: Security audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit critical issues across all dependencies
        run: npm run audit:critical

  rustsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        # RUSTSEC-2023-0071 has no patched rsa release as of 2026-09-14.
        # SQLx uses rsa as a MySQL client for public-key password encryption;
        # OrbitoDB never performs RSA private-key decryption, which is the
        # vulnerable timing-side-channel operation described by the advisory.
        run: cargo audit --ignore RUSTSEC-2023-0071
