name: Release

# Builds a standalone Windows .exe and publishes it to GitHub Releases.
# Releases are deliberate: only a version tag creates an artifact.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Verify frontend
        run: npm test

      - name: Verify Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Stamp tagged version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Tag must contain a semantic version (for example v0.1.0)"
          }
          $p = "src-tauri/tauri.conf.json"
          (Get-Content $p -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$version`"" | Set-Content $p -Encoding utf8
          $cargo = "src-tauri/Cargo.toml"
          (Get-Content $cargo -Raw) -replace '(?m)^version\s*=\s*"[^"]*"', "version = `"$version`"" | Set-Content $cargo -Encoding utf8
          Write-Output "App version -> $version"

      - name: Build standalone .exe (no installer / no wizard)
        run: npm run tauri build -- --no-bundle

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-exe | Out-Null
          Copy-Item "src-tauri/target/release/orbitodb.exe" "dist-exe/OrbitoDB.exe"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist-exe/OrbitoDB.exe
          name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            **OrbitoDB — standalone Windows executable.**

            Download **`OrbitoDB.exe`** below and run it. No installer, no wizard,
            nothing else to download. (Uses the Microsoft Edge WebView2 runtime,
            which ships with Windows 10 & 11.)
