name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npx vitest run src/lib/crossTableSearch.test.ts src/lib/ddl.test.ts src/lib/schemaChanges.test.ts src/lib/databaseObjects.test.ts src/lib/explain.test.ts src/lib/backup.test.ts src/lib/csv.test.ts src/lib/importSql.test.ts src/lib/tablePaging.test.ts src/lib/duplicateRow.test.ts src/lib/maintenance.test.ts src/state/safety.test.ts

      - name: Bridge syntax check
        run: node --check server/bridge.mjs

      - name: TypeScript + Vite build
        run: npm run build

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
