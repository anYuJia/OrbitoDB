name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm run test:ci

      - name: Source quality gate
        run: npm run check:quality

      - name: Dependency audit
        run: npm run audit:security

      - name: Bridge syntax check
        run: npm run check:bridge

      - name: Release configuration check
        run: npm run check:release

      - name: TypeScript + Vite build
        run: npm run build

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib


  platform-compile:
    name: platform-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            linux: true
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            linux: false
          - name: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            linux: false

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux Tauri dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cross-platform Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
